<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caça aos Gatinhos 🐱</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; overflow:hidden;
  font-family:Arial, sans-serif;
  background:linear-gradient(180deg,#b9ff6b 0%,#72bd55 55%,#31543b 100%);
  color:#fff; display:flex; justify-content:center; align-items:center;
}
#game{
  position:relative; width:min(100vw,900px); height:min(100vh,650px);
  overflow:hidden; border:4px solid #16251b; border-radius:20px;
  background:linear-gradient(#bfff72,#8fd85f 62%,#477344);
  box-shadow:0 12px 35px #0008;
}
#hud{
  position:absolute; z-index:10; top:12px; left:12px; right:12px;
  display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;
  font-weight:bold;
}
.box{
  background:#14251ddd; border:2px solid #dfffad; border-radius:12px;
  padding:8px 13px; text-shadow:1px 2px #000;
}
#startScreen,#gameOver{
  position:absolute; inset:0; z-index:30; display:flex; flex-direction:column;
  justify-content:center; align-items:center; text-align:center;
  background:#07120ddd; padding:25px;
}
#gameOver{display:none}
h1{font-size:clamp(32px,7vw,62px); margin:0 0 10px; color:#dfff71}
p{font-size:18px; max-width:600px; line-height:1.5}
button{
  border:0; border-radius:14px; padding:14px 24px; font-size:18px;
  font-weight:bold; cursor:pointer; background:#dfff71; color:#17301b;
  box-shadow:0 5px 0 #628c36; margin-top:10px;
}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #628c36}
#player{
  position:absolute; z-index:8; bottom:18px; width:125px; height:190px;
  object-fit:contain; object-position:center bottom; user-select:none;
  pointer-events:none; filter:drop-shadow(0 6px 3px #0006);
}
.cat{
  position:absolute; z-index:6; width:55px; height:55px;
  display:flex; align-items:center; justify-content:center;
  font-size:43px; user-select:none;
  filter:drop-shadow(0 4px 2px #0006);
}
.spark{
  position:absolute; z-index:9; font-size:26px; pointer-events:none;
  animation:pop .45s ease-out forwards;
}
@keyframes pop{0%{transform:scale(.5);opacity:1}100%{transform:translateY(-35px) scale(1.5);opacity:0}}
#ground{position:absolute;bottom:0;left:0;right:0;height:115px;background:linear-gradient(#3f783f,#25472f);opacity:.9}
.tree{position:absolute;bottom:90px;font-size:80px;opacity:.55;z-index:1}
#controls{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);z-index:15;display:flex;gap:18px}
.ctrl{width:64px;height:52px;margin:0;padding:0;background:#14251dcc;color:white;border:2px solid #dfffad}
.small{font-size:14px;opacity:.9}
</style>
</head>

  <div id="controls">
    <button class="ctrl" id="left">◀</button>
    <button class="ctrl" id="right">▶</button>
  </div>

  <div id="startScreen">
    <h1>🐱 Caça aos Gatinhos!</h1>
    <p>Ajude o personagem da foto a pegar <b>o máximo de gatos possível</b>!</p>
    <p class="small">Use <b>← →</b> ou <b>A / D</b> para andar. Pegue os gatos que caem antes que desapareçam!</p>
    <button id="start">COMEÇAR JOGO</button>
  </div>

  <div id="gameOver">
    <h1>Fim de jogo! 😺</h1>
    <p>Você pegou <b><span id="finalScore">0</span> gatos</b>!</p>
    <p id="message"></p>
    <button id="restart">JOGAR NOVAMENTE</button>
  </div>
</div>

<script>
const game=document.getElementById('game');
const player=document.getElementById('player');
const scoreEl=document.getElementById('score');
const timeEl=document.getElementById('time');
const bestEl=document.getElementById('best');
const startScreen=document.getElementById('startScreen');
const gameOver=document.getElementById('gameOver');
const finalScore=document.getElementById('finalScore');
const message=document.getElementById('message');

let x=0, score=0, time=60, running=false;
let keys={left:false,right:false};
let cats=[];
let spawnTimer=0, last=0, clockTimer;

let best=Number(localStorage.getItem('gatinhosRecorde')||0);
bestEl.textContent=best;

function resizePlayer(){
  x=Math.max(0,Math.min(x,game.clientWidth-player.offsetWidth));
  player.style.left=x+'px';
}
function setKeys(e,down){
  if(['ArrowLeft','a','A'].includes(e.key)) keys.left=down;
  if(['ArrowRight','d','D'].includes(e.key)) keys.right=down;
}
addEventListener('keydown',e=>setKeys(e,true));
addEventListener('keyup',e=>setKeys(e,false));

function bindButton(id,dir){
  const b=document.getElementById(id);
  b.addEventListener('pointerdown',e=>{e.preventDefault();keys[dir]=true});
  b.addEventListener('pointerup',()=>keys[dir]=false);
  b.addEventListener('pointerleave',()=>keys[dir]=false);
  b.addEventListener('pointercancel',()=>keys[dir]=false);
}
bindButton('left','left'); bindButton('right','right');

function spawnCat(){
  const c=document.createElement('div');
  c.className='cat';
  c.textContent=['🐱','😺','😸','😹','😻'][Math.floor(Math.random()*5)];
  const maxX=game.clientWidth-60;
  c.x=Math.random()*maxX; c.y=-60;
  c.speed=150+Math.random()*100+(60-time)*2;
  c.style.left=c.x+'px'; c.style.top=c.y+'px';
  game.appendChild(c); cats.push(c);
}

function caught(c){
  const px=x+10, pw=player.offsetWidth-20;
  const py=game.clientHeight-player.offsetHeight-10;
  return c.x+45>px && c.x<px+pw && c.y+45>py && c.y<py+player.offsetHeight;
}

function pop(x,y){
  const s=document.createElement('div'); s.className='spark';
  s.textContent='+1 🐱'; s.style.left=x+'px'; s.style.top=y+'px';
  game.appendChild(s); setTimeout(()=>s.remove(),450);
}

function loop(t){
  if(!running) return;
  const dt=Math.min((t-last)/1000,.04); last=t;
  const speed=430;
  if(keys.left)x-=speed*dt;
  if(keys.right)x+=speed*dt;
  resizePlayer();

  spawnTimer-=dt;
  if(spawnTimer<=0){
    spawnCat();
    spawnTimer=Math.max(.35,.85-(60-time)*.006);
  }

  for(let i=cats.length-1;i>=0;i--){
    const c=cats[i];
    c.y+=c.speed*dt; c.style.top=c.y+'px';
    if(caught(c)){
      score++; scoreEl.textContent=score;
      pop(c.x,c.y); c.remove(); cats.splice(i,1); continue;
    }
    if(c.y>game.clientHeight-65){c.remove();cats.splice(i,1)}
  }
  requestAnimationFrame(loop);
}

function startGame(){
  cats.forEach(c=>c.remove()); cats=[];
  score=0; time=60; x=(game.clientWidth-player.offsetWidth)/2;
  scoreEl.textContent=0; timeEl.textContent=60; resizePlayer();
  startScreen.style.display='none'; gameOver.style.display='none';
  running=true; spawnTimer=.2; last=performance.now();
  clearInterval(clockTimer);
  clockTimer=setInterval(()=>{
    if(!running)return;
    time--; timeEl.textContent=time;
    if(time<=0) endGame();
  },1000);
  requestAnimationFrame(loop);
}

function endGame(){
  running=false; clearInterval(clockTimer);
  finalScore.textContent=score;
  if(score>best){
    best=score; localStorage.setItem('gatinhosRecorde',best);
    bestEl.textContent=best; message.textContent='🎉 Novo recorde!';
  }else{
    message.textContent='Tente bater seu recorde de '+best+' gatos!';
  }
  gameOver.style.display='flex';
}

document.getElementById('start').onclick=startGame;
document.getElementById('restart').onclick=startGame;
addEventListener('resize',resizePlayer);
resizePlayer();
</script>

</html>
